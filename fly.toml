# Replace 'hexar' with your actual Fly.io app name after running `fly launch`.
app = 'hexar'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # CRITICAL: do not auto-stop — sleeping machines kill active WebSocket connections.
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
